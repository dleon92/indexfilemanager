<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Index</title>
<style>
:root{--bg:#f6f6f4;--panel:#fff;--line:#e3e3df;--text:#1d1d1b;--muted:#6b6b66;--accent:#5b4fd6;--accent-soft:#ece9ff;--danger:#c0392b;--sel:#e7e4ff;--hover:#f0f0ec}
@media (prefers-color-scheme:dark){:root{--bg:#141416;--panel:#1c1c1f;--line:#2c2c31;--text:#e9e9ec;--muted:#9a9aa2;--accent:#9d93ff;--accent-soft:#2a2741;--danger:#ff7b6b;--sel:#2c2850;--hover:#232327}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 11px;cursor:pointer;white-space:nowrap}
button:hover:not(:disabled){background:var(--hover)}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.danger{color:var(--danger)}
input[type=text],input[type=password],input[type=search]{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 9px;outline:none}
input:focus{border-color:var(--accent)}
a{color:var(--accent)}
.hidden{display:none!important}
#login{display:flex;align-items:center;justify-content:center;height:100%}
#login form{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:28px;width:320px;display:flex;flex-direction:column;gap:12px}
#login h1{margin:0;font-size:20px}
#login .err{color:var(--danger);min-height:1.4em;font-size:13px}
#app{display:grid;grid-template-columns:270px 1fr;grid-template-rows:auto 1fr;height:100%}
header{grid-column:1/3;display:flex;align-items:center;gap:16px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
header .brand{font-weight:700}
header .dev{color:var(--muted)}
header .sp{flex:1}
aside{border-right:1px solid var(--line);overflow:auto;padding:10px 8px;background:var(--panel)}
aside h3{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:10px 6px 6px}
.vol{padding:7px 8px;border-radius:6px;cursor:pointer}
.vol:hover{background:var(--hover)}
.vol.on{background:var(--accent-soft)}
.vol .bar{height:4px;background:var(--line);border-radius:2px;margin:5px 0 3px;overflow:hidden}
.vol .bar i{display:block;height:100%;background:var(--accent)}
.vol small{color:var(--muted)}
.tree{font-size:13px}
.tn{display:flex;align-items:center;gap:2px;padding:2px 4px;border-radius:4px;cursor:pointer;white-space:nowrap}
.tn:hover{background:var(--hover)}
.tn.on{background:var(--accent-soft);font-weight:600}
.tn .car{width:16px;text-align:center;color:var(--muted);flex:none}
.tn .nm{overflow:hidden;text-overflow:ellipsis}
.info{font-size:12px;color:var(--muted);padding:4px 8px;line-height:1.6}
main{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
.bar1{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.crumbs{display:flex;align-items:center;gap:2px;flex-wrap:wrap;flex:1;min-width:200px}
.crumbs span{padding:2px 6px;border-radius:4px;cursor:pointer}
.crumbs span:hover{background:var(--hover)}
.crumbs .sep{color:var(--muted);cursor:default;padding:0}
.crumbs .sep:hover{background:none}
.bar2{display:flex;align-items:center;gap:6px;padding:8px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.bar2 .sp{flex:1}
.bar2 label{display:flex;align-items:center;gap:4px;color:var(--muted);font-size:13px}
.seg{display:inline-flex}
.seg button{border-radius:0}
.seg button:first-child{border-radius:6px 0 0 6px}
.seg button:last-child{border-radius:0 6px 6px 0;border-left:none}
.seg button.on{background:var(--accent-soft)}
#list{flex:1;overflow:auto}
table{width:100%;border-collapse:collapse}
th{position:sticky;top:0;background:var(--bg);text-align:left;font-weight:600;color:var(--muted);font-size:12px;padding:6px 10px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none}
td{padding:5px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
tr.row{cursor:default}
tr.row:hover{background:var(--hover)}
tr.row.sel{background:var(--sel)}
td.n{width:100%;max-width:0;overflow:hidden;text-overflow:ellipsis}
td.n .k{display:inline-block;width:38px;font-size:10px;color:var(--muted);text-transform:uppercase}
td.n .dir{font-weight:600}
td.s,td.m{color:var(--muted);text-align:right}
th.s,th.m{text-align:right}
.chk{width:32px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--tile,160px),1fr));gap:10px;padding:14px}
.tile{border:1px solid var(--line);border-radius:8px;background:var(--panel);overflow:hidden;cursor:default;position:relative}
.tile.sel{outline:2px solid var(--accent);background:var(--sel)}
.tile .th{aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:var(--hover);color:var(--muted);font-size:13px;text-transform:uppercase;overflow:hidden;position:relative}
.tile .th img{width:100%;height:100%;object-fit:cover}
.tile .th.dir{background:var(--accent-soft);color:var(--accent);font-weight:600}
.tile .tc{position:absolute;top:6px;left:6px;width:18px;height:18px;z-index:1;opacity:0;cursor:pointer}
.tile:hover .tc,.tile.sel .tc,.grid.picking .tc{opacity:1}
.tile .vb{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.65);color:#fff;font-size:11px;padding:1px 6px;border-radius:4px;text-transform:none}
td.n .mini{display:inline-block;width:28px;height:28px;border-radius:4px;object-fit:cover;vertical-align:middle;margin-right:10px;background:var(--hover)}
td.n .k{vertical-align:middle}
.tile .tt{padding:6px 8px;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{padding:40px;text-align:center;color:var(--muted)}
#drop{position:absolute;inset:8px;border:2px dashed var(--accent);border-radius:12px;background:color-mix(in srgb,var(--bg) 85%,transparent);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--accent);pointer-events:none}
#status{padding:5px 14px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;display:flex;gap:16px}
#ups{position:fixed;right:16px;bottom:16px;width:360px;max-height:50vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.18);font-size:13px}
#ups .hd{display:flex;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);gap:8px}
#ups .hd b{flex:1}
#ups .it{padding:6px 12px;border-bottom:1px solid var(--line)}
#ups .it .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#ups .pb{height:4px;background:var(--line);border-radius:2px;margin-top:4px;overflow:hidden}
#ups .pb i{display:block;height:100%;background:var(--accent);width:0}
#ups .it.err .nm{color:var(--danger)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:10}
.dlg{background:var(--panel);border-radius:10px;padding:20px;width:min(440px,92vw);display:flex;flex-direction:column;gap:12px;max-height:85vh}
.dlg h2{margin:0;font-size:16px}
.dlg .btns{display:flex;justify-content:flex-end;gap:8px}
.dlg input{width:100%}
.pick{border:1px solid var(--line);border-radius:6px;overflow:auto;min-height:220px;max-height:45vh;padding:4px}
#pv{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:9;display:flex;flex-direction:column}
#pv .top{display:flex;align-items:center;gap:8px;padding:10px 14px;color:#fff}
#pv .top .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pv .top button{background:rgba(255,255,255,.12);border-color:transparent;color:#fff}
#pv .body{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:0 14px 14px}
#pv img,#pv video{max-width:100%;max-height:100%}
#pv iframe{width:100%;height:100%;border:0;background:#fff;border-radius:6px}
#pv audio{width:min(600px,90vw)}
/* ---------- celular e tablet */
#menu,#bClr,#scrim{display:none}
#app{height:100dvh}
#login form{width:min(320px,92vw)}
.dlg .btns{flex-wrap:wrap}
#toast{max-width:min(80vw,520px)!important}
/* telas de toque: alvos maiores, caixas de seleção sempre visíveis */
@media (pointer:coarse){
  html{-webkit-text-size-adjust:100%}
  body{touch-action:manipulation}
  button{padding:9px 14px;min-height:40px}
  input[type=text],input[type=password],input[type=search]{padding:9px 11px;font-size:16px}
  input[type=checkbox]{width:20px;height:20px}
  td{padding:10px}
  .tn{padding:7px 6px}
  .vol{padding:10px}
  .crumbs span{padding:6px 8px}
  .tile .tc{opacity:.9;width:24px;height:24px}
  .tile,tr.row{-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
  #app.has-sel #bClr{display:inline-block}
}
/* tablet */
@media (max-width:1100px){
  #app{grid-template-columns:220px 1fr}
  .bar2{gap:5px}
}
/* celular (ou tablet em pé estreito): pastas viram gaveta */
@media (max-width:760px){
  #app{grid-template-columns:1fr}
  header{grid-column:1;gap:10px;padding:6px 10px}
  header .dev{display:none}
  #bat{font-size:12px}
  #menu{display:inline-block;font-size:18px;line-height:1;padding:6px 12px}
  aside{position:fixed;top:0;left:0;bottom:0;width:min(320px,84vw);z-index:8;transform:translateX(-102%);transition:transform .2s ease;box-shadow:4px 0 24px rgba(0,0,0,.25);border-right:none}
  #app.drawer aside{transform:none}
  #app.drawer #scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:7}
  .bar1{padding:6px 10px;gap:6px}
  .crumbs{flex-wrap:nowrap;overflow-x:auto;min-width:0;scrollbar-width:none}
  .crumbs::-webkit-scrollbar{display:none}
  .crumbs span{white-space:nowrap}
  #q{width:100%!important;flex-basis:100%;order:3}
  .bar2{flex-wrap:nowrap;overflow-x:auto;padding:6px 10px;scrollbar-width:none}
  .bar2::-webkit-scrollbar{display:none}
  .bar2 .sp{flex:0 0 4px}
  .bar2 label{white-space:nowrap}
  /* com algo selecionado, a barra mostra só as ações da seleção */
  #app.has-sel #bUp,#app.has-sel #bUpDir,#app.has-sel #bMk,#app.has-sel .bar2 .gap{display:none}
  #app.has-sel #bClr{display:inline-block}
  th.m,td.m{display:none}
  td{padding-left:8px;padding-right:8px}
  td.n .k{width:30px}
  td.n .mini{width:36px;height:36px;margin-right:8px}
  .grid{gap:8px;padding:8px}
  #status{padding:5px 10px;gap:10px;flex-wrap:wrap}
  #ups{left:8px;right:8px;bottom:8px;width:auto}
  #pv .top{flex-wrap:wrap;padding:8px 10px;gap:6px}
  #pv .top .nm{order:-1;flex-basis:100%;font-size:13px}
  #pv .top .x{margin-left:auto}
  #pv .body{padding:0 6px 6px}
  .dlg{padding:16px;width:94vw}
  .pick{max-height:55vh}
}
</style>
</head>
<body>
<div id="login" class="hidden">
  <form id="lf" autocomplete="off">
    <h1>Index</h1>
    <div style="color:var(--muted)">Digite a senha definida no app (Acesso pelo computador).</div>
    <input id="pw" type="password" placeholder="Senha" autofocus>
    <button class="primary" type="submit">Entrar</button>
    <div class="err" id="lerr"></div>
  </form>
</div>

<div id="app" class="hidden">
  <header>
    <button id="menu" title="Pastas e armazenamento" aria-label="Menu">☰</button>
    <span class="brand">Index</span>
    <span class="dev" id="dev"></span>
    <span class="sp"></span>
    <span id="bat" style="color:var(--muted)"></span>
    <button id="logout">Sair</button>
  </header>
  <aside>
    <h3>Armazenamento</h3>
    <div id="vols"></div>
    <h3>Pastas</h3>
    <div class="tree" id="tree"></div>
    <h3>Aparelho</h3>
    <div class="info" id="devinfo"></div>
  </aside>
  <div id="scrim"></div>
  <main>
    <div class="bar1">
      <button id="up" title="Pasta acima (Backspace)">↑</button>
      <div class="crumbs" id="crumbs"></div>
      <input type="search" id="q" placeholder="Buscar nesta pasta e subpastas" style="width:260px">
    </div>
    <div class="bar2">
      <button id="bUp">Enviar arquivos</button>
      <button id="bUpDir">Enviar pasta</button>
      <button id="bMk">Nova pasta</button>
      <span class="gap" style="width:8px"></span>
      <button id="bClr" title="Limpar seleção">✕ Limpar</button>
      <button id="bDl" disabled>Baixar</button>
      <button id="bRn" disabled>Renomear</button>
      <button id="bMv" disabled>Mover</button>
      <button id="bCp" disabled>Copiar</button>
      <button id="bRm" class="danger" disabled>Apagar</button>
      <span class="sp"></span>
      <label><input type="checkbox" id="hid"> Ocultos</label>
      <span class="seg"><button id="vList">Lista</button><button id="vGrid">Miniaturas</button></span>
      <span class="seg" id="sizes"><button data-z="s" title="Miniaturas pequenas">P</button><button data-z="m" title="Miniaturas médias">M</button><button data-z="l" title="Miniaturas grandes">G</button></span>
      <button id="bRf" title="Atualizar (F5)">Atualizar</button>
    </div>
    <div id="list"></div>
    <div id="status"><span id="st1"></span><span id="st2"></span></div>
    <div id="drop" class="hidden">Solte para enviar para esta pasta</div>
  </main>
</div>

<div id="ups" class="hidden"><div class="hd"><b id="upt"></b><button id="upx">Fechar</button></div><div id="upl"></div></div>
<div id="pv" class="hidden"><div class="top"><button id="pvPrev">‹ Anterior</button><button id="pvNext">Próximo ›</button><span class="nm" id="pvName"></span><button id="pvDl">Baixar</button><button id="pvClose" class="x" title="Fechar (Esc)">Fechar</button></div><div class="body" id="pvBody"></div></div>
<input type="file" id="fFiles" multiple class="hidden">
<input type="file" id="fDir" webkitdirectory multiple class="hidden">

<script>
"use strict";
const $=s=>document.querySelector(s);
const el=(t,a={},...c)=>{const e=document.createElement(t);for(const k in a){if(k==="class")e.className=a[k];else if(k.startsWith("on"))e.addEventListener(k.slice(2),a[k]);else if(a[k]!=null)e.setAttribute(k,a[k])}for(const x of c)if(x!=null)e.append(x);return e};
const S={vols:[],v:0,path:"/",entries:[],sel:new Set(),last:null,sort:{k:"n",asc:true},hidden:false,view:localStorage.getItem("idx.view")||"list",search:null,tree:new Map(),open:new Set()};
try{S.hidden=localStorage.getItem("idx.hidden")==="1"}catch(e){}
S.zoom="m";try{S.zoom=localStorage.getItem("idx.zoom")||"m"}catch(e){}
const ZOOM={s:{px:110,q:192},m:{px:170,q:256},l:{px:260,q:384}};
// Toque (celular/tablet): um toque abre; segurar seleciona; com algo selecionado, o toque marca/desmarca.
const touch=()=>matchMedia("(pointer:coarse)").matches;
const thumbable=n=>IMG.test(n)||VID.test(n)||AUD.test(n);

const IMG=/\.(jpe?g|png|gif|webp|bmp|heic|heif|avif)$/i, VID=/\.(mp4|m4v|webm|mkv|mov|3gp|avi|ts)$/i, AUD=/\.(mp3|m4a|aac|ogg|opus|flac|wav|amr)$/i, PDF=/\.pdf$/i, TXT=/\.(txt|md|log|json|xml|csv|srt|vtt|ini|cfg|conf|yml|yaml|kt|java|py|js|css|html?|sh|bat)$/i;

function join(p,n){return (p==="/"?"":p)+"/"+n}
function parent(p){if(p==="/")return "/";const i=p.lastIndexOf("/");return i<=0?"/":p.slice(0,i)}
function q(o){return Object.entries(o).flatMap(([k,v])=>Array.isArray(v)?v.map(x=>k+"="+encodeURIComponent(x)):[k+"="+encodeURIComponent(v)]).join("&")}
function fmtSize(b){if(b==null)return "";const u=["B","KB","MB","GB","TB"];let i=0;while(b>=1024&&i<u.length-1){b/=1024;i++}return (i?b.toLocaleString("pt-BR",{maximumFractionDigits:b<10?1:0}):b)+" "+u[i]}
function fmtDate(ms){return new Date(ms).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"})}
function ext(n){const i=n.lastIndexOf(".");return i>0?n.slice(i+1).slice(0,4):""}
function fileUrl(p,dl){return "/api/file?"+q({v:S.v,p})+(dl?"&dl=1":"")}

async function api(method,url,body){
  const r=await fetch(url,{method,headers:body!==undefined?{"Content-Type":"application/json","X-Index":"1"}:(method!=="GET"?{"X-Index":"1"}:{}),body:body!==undefined?JSON.stringify(body):undefined,credentials:"same-origin"});
  if(r.status===401){showLogin();throw new Error("login")}
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error||("erro "+r.status));
  return j;
}

// ---------- login
function showLogin(){$("#app").classList.add("hidden");$("#login").classList.remove("hidden");$("#pw").focus()}
$("#lf").addEventListener("submit",async e=>{
  e.preventDefault();$("#lerr").textContent="";
  const r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:$("#pw").value})});
  const j=await r.json().catch(()=>({}));
  if(r.ok){$("#pw").value="";start();return}
  $("#lerr").textContent=j.error==="wait"?`Muitas tentativas. Espere ${Math.ceil(j.wait/60)} min.`:"Senha errada.";
});
$("#logout").onclick=async()=>{try{await api("POST","/api/logout")}catch(e){}showLogin()};

// ---------- início
async function start(){
  try{await loadInfo()}catch(e){if(e.message!=="login")alert(e.message);return}
  $("#login").classList.add("hidden");$("#app").classList.remove("hidden");
  const h=location.hash.slice(1);
  if(h){const m=h.match(/^(\d+)(\/.*)?$/);if(m&&S.vols[+m[1]]){S.v=+m[1];S.path=decodeURIComponent(m[2]||"/")}}
  await go(S.path,true);
}
async function loadInfo(){
  const j=await api("GET","/api/info");
  S.vols=j.volumes;
  $("#dev").textContent=j.device;
  const b=j.battery;
  $("#bat").textContent=b&&b.level!=null?`Bateria ${b.level}%${b.full?" (cheia)":b.charging?" (carregando)":""}`:"";
  const info=[`${j.device}`,`Android ${j.android}`];
  if(b&&b.level!=null)info.push(`Bateria: ${b.level}%${b.charging?", carregando":b.plugged?", na tomada":""}`);
  if(b&&b.temp!=null)info.push(`Temperatura da bateria: ${b.temp.toLocaleString("pt-BR")} °C`);
  $("#devinfo").innerHTML="";info.forEach(t=>$("#devinfo").append(el("div",{},t)));
  renderVols();
}
setInterval(()=>{if(!$("#app").classList.contains("hidden"))loadInfo().catch(()=>{})},60000);

function renderVols(){
  const box=$("#vols");box.innerHTML="";
  S.vols.forEach(v=>{
    const used=v.total?(v.total-v.free)/v.total*100:0;
    box.append(el("div",{class:"vol"+(v.i===S.v?" on":""),onclick:()=>{S.v=v.i;S.tree.clear();S.open.clear();go("/")}},
      el("div",{},v.name),el("div",{class:"bar"},el("i",{style:`width:${used.toFixed(1)}%`})),
      el("small",{},`${fmtSize(v.free)} livres de ${fmtSize(v.total)}`)));
  });
}

// ---------- navegação
async function go(path,replace){
  $("#app").classList.remove("drawer");
  S.search=null;$("#q").value="";
  let j;
  try{j=await api("GET","/api/list?"+q({v:S.v,p:path}))}
  catch(e){if(e.message==="login")return;if(path!=="/"){toast("Pasta indisponível: "+e.message);return go("/",replace)}toast(e.message);return}
  S.path=j.path;S.entries=j.entries;S.sel.clear();S.last=null;S.writable=j.writable;
  S.tree.set(S.v+":"+S.path,j.entries.filter(x=>x.d).map(x=>x.n));
  // abre a árvore até a pasta atual
  let p=S.path;while(true){S.open.add(S.v+":"+p);if(p==="/")break;p=parent(p)}
  const h="#"+S.v+encodeURI(S.path);
  if(replace)history.replaceState(null,"",h);else if(location.hash!==h)history.pushState(null,"",h);
  renderVols();render();renderTree();
}
window.addEventListener("popstate",()=>{const m=location.hash.slice(1).match(/^(\d+)(\/.*)?$/);if(m){S.v=+m[1];go(decodeURIComponent(m[2]||"/"),true)}});

function visible(){
  let a=(S.search||S.entries).filter(e=>S.hidden||!e.n.startsWith("."));
  const {k,asc}=S.sort,m=asc?1:-1;

})}
let toastT;
function toast(msg){let t=$("#toast");if(!t){t=el("div",{id:"toast",style:"position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 16px;border-radius:8px;z-index:20;max-width:80vw"});document.body.append(t)}t.textContent=msg;t.classList.remove("hidden");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.add("hidden"),3500)}

// ---------- teclado
document.addEventListener("keydown",e=>{
  if($("#app").classList.contains("hidden")||document.querySelector(".modal"))return;
  if(!$("#pv").classList.contains("hidden")){if(e.key==="Escape")closePv();if(e.key==="ArrowLeft")$("#pvPrev").click();if(e.key==="ArrowRight")$("#pvNext").click();return}
  if(e.target.tagName==="INPUT")return;
  const items=visible();
  if(e.key==="Backspace"){e.preventDefault();if(S.search){$("#q").value="";S.search=null;render()}else go(parent(S.path))}
  else if(e.key==="Delete"&&!$("#bRm").disabled)$("#bRm").click();
  else if(e.key==="F2"&&!$("#bRn").disabled){e.preventDefault();$("#bRn").click()}
  else if(e.key==="F5"){e.preventDefault();$("#bRf").click()}
  else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="a"){e.preventDefault();items.forEach(x=>S.sel.add(keyOf(x)));render()}
  else if(e.key==="Enter"){const s=selected();if(s.length===1)openItem(s[0],items)}
  else if(e.key==="Escape"){S.sel.clear();render()}
  else if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();const ks=items.map(keyOf);let i=ks.indexOf(S.last);i=e.key==="ArrowDown"?Math.min(ks.length-1,i+1):Math.max(0,i-1);if(ks[i]!=null){S.sel.clear();S.sel.add(ks[i]);S.last=ks[i];render()}}
});

start();
</script>
